# ╔══════════════════════════════════════════════════════╗
# ║              WALKER CONFIGURATION                    ║
# ╚══════════════════════════════════════════════════════╝

theme = "rice"
close_when_open = true
click_to_close = true
selection_wrap = true

[placeholders]
"default" = { input = "Search...", list = "No Results" }
"desktopapplications" = { input = "Launch App...", list = "No Apps Found" }
"menus:main" = { input = "Search or select...", list = "No entries" }

[providers]
default = [
    "desktopapplications",
    "calc",
    "runner",
    "websearch",
    "menus",
]
empty = ["desktopapplications"]
max_results = 50

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "/"
provider = "files"

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"

[[providers.prefixes]]
prefix = "."
provider = "symbols"

[[providers.prefixes]]
prefix = ";"
provider = "providerlist"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

# ── Sets are DEAD on this binary ─────────────────────
# `walker -s <name>` / the TOML "sets" tables (formerly `sets` dot
# `runner` here) panic walker 2.16.2's gapplication service and kill it
# (`can't find specified set`, src/data.rs:566) — proven live (07-01
# D-05 spike), reproduced even against a correctly shaped set block. Do
# NOT re-add a "sets" table or wire anything to `-s`/`--set`. Use
# exclusive-provider mode instead: `walker -m <provider>` (e.g.
# `walker -m runner`, `walker -m menus:main`) — verified to render and
# leave the service alive. See 07-01-PLAN.md <spike_correction>.

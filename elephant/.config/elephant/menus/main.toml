name = "main"
name_pretty = "Menu"

# D-10: root is exactly the six requirement groups, task-frequency order,
# Power LAST (destructive, must not sit under the default cursor position).
# No pinned flat quick-actions mixed in (D-10 explicitly rejects them).

[[entries]]
text = "  Utilities"
submenu = "utilities"

[[entries]]
text = "  Settings"
submenu = "settings"

[[entries]]
text = "  AI Dashboard"
submenu = "ai-dashboard"

[[entries]]
text = "  Game Center"
submenu = "game-center"

[[entries]]
text = "  Keybinds"
# 07-08 landed cheat-sheet.sh — the forward reference authored in 07-05 is
# now resolved (D-29: a walker searchable list; picking "View all
# keybinds ›" from inside it opens the kitty table surface).
actions = { "open" = "~/.config/hypr/scripts/cheat-sheet.sh" }

[[entries]]
text = "  Power"
# D-20-22: delegates to the ONE existing power surface (same as
# Super+Shift+Q) — repointed from wleave.sh to the in-process QML power
# menu's own GlobalShortcut. `hyprctl dispatch` on this Lua-config-managed
# instance takes a Lua expression, not the classic `dispatcher,args`
# string (keybinds.lua:44-49's own recorded finding), so this dispatches
# the identical `hl.dsp.global("quickshell:power-menu")` call
# keybinds.lua:68 uses, verified live against the equivalent
# quickshell:probe shortcut before landing here.
# D-09: shell script, invoked bare — never uwsm app --.
actions = { "open" = "hyprctl dispatch 'hl.dsp.global(\"quickshell:power-menu\")'" }

name = "settings"
name_pretty = "Settings"
parent = "main"

# D-14/D-15: appearance entries reuse the existing Phase 5/6 scripts unchanged.
# D-13: Icon theme / Font live HERE, not Utilities (do vs configure split).
# D-09 two-class convention: shell scripts invoked bare; GUI apps via
# `uwsm app --` (mirrors keybinds.conf exactly).
# D-16: Wallpaper/Icon theme/Font intentionally close the menu and hand off
# to a floating-kitty picker with kitty-graphics previews — not rebuilt as
# walker submenus (walker's list view cannot draw them).

[[entries]]
text = "  Theme"
actions = { "open" = "~/.config/hypr/scripts/theme-switch.sh" }

[[entries]]
text = "  Wallpaper"
actions = { "open" = "~/.config/hypr/scripts/wallpaper-switch.sh" }

[[entries]]
text = "  Icon theme"
actions = { "open" = "~/.config/hypr/scripts/icon-theme-switch.sh" }

[[entries]]
text = "  Font"
actions = { "open" = "~/.config/hypr/scripts/font-switch.sh" }

[[entries]]
text = "  Waybar layout"
actions = { "open" = "~/.config/hypr/scripts/waybar-switch.sh" }

[[entries]]
text = "  Network"
# D-17: nmtui in a floating kitty — the shim itself does the uwsm/kitty wrap.
actions = { "open" = "~/.config/hypr/scripts/nmtui-launch.sh" }

[[entries]]
text = "  Bluetooth"
actions = { "open" = "uwsm app -- blueman-manager" }

[[entries]]
text = "  Audio"
actions = { "open" = "uwsm app -- pavucontrol" }

[[entries]]
text = "  Display"
actions = { "open" = "uwsm app -- nwg-displays" }

# tmux.conf — quick task 260819-vas: tmux as a fully theme-integrated surface
#
# Section order in this file IS the mechanism (M-3, measured on tmux 3.7c):
# a `run` line executes in config order, and later `set` lines simply win
# over anything an earlier `run`-sourced plugin wrote. So behaviour/plugin
# declarations come first, and the themed `source-file` at the very bottom
# is what makes matugen the sole, unconditional writer of every colour
# option (D-03) — no per-plugin colour audit needed, ordering alone does it.

# ── Behaviour ─────────────────────────────────────────
# No colour option is set anywhere in this section. Every colour in this
# file comes from the sourced state-dir fragment at the bottom.
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
# Prefix stays the default C-b — nothing in this task's scope justifies
# remapping it.

# ── Plugin manager path (M-2) ────────────────────────────────────────
# tpm 3.1.0's scripts/variables.sh only computes a default
# ($HOME/.tmux/plugins/) when `show-environment -g TMUX_PLUGIN_MANAGER_PATH`
# fails, i.e. when this is UNSET. This line MUST precede the `run` line
# below, or stow.sh's pre-created ~/.config/tmux/plugins/ protects a
# directory tpm never actually writes to.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# ── Plugins (D-03: behaviour-only, never colours) ────────────────────
# tpm's plugin-list parser is a text scan requiring the plugin name to be
# field 4 of a line matching `^[ \t]*set(-option)? +-g +@plugin` — keep
# this exact shape for all four. No self-referential `tpm` @plugin line:
# tpm itself arrives via the AUR `tmux-plugin-manager` package (M-1), not
# via its own git-clone bootstrap, so there is nothing for tpm to manage
# about itself here.
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Guarded on tpm's presence (AUR `tmux-plugin-manager`, M-1) so a host that
# has not installed the AUR package yet still starts a clean server instead
# of erroring on a missing `run` target.
if-shell '[ -x /usr/share/tmux-plugin-manager/tpm ]' "run '/usr/share/tmux-plugin-manager/tpm'" ""

# ── Theme colours — LAST line, load-bearing (D-03/D-04) ─────────────
# `-q` tolerates a missing target (M-5): a fresh install, before the first
# theme-apply has ever run, still starts cleanly with tmux's stock look —
# the same graceful-degradation shape as fish/config.fish's `test -f`
# guard, just expressed through tmux's own flag instead of a shell `if`.
#
# Because a `run` line is ordered against later `set` lines (M-3), this
# source-file is the LAST writer to every colour option in the file,
# unconditionally overriding anything tpm's plugins set upstream of it.
# That ordering — not auditing each plugin for colour writes — is the
# entire mechanism keeping matugen the sole colour writer (D-03).
#
# Known trade-off (M-4): tmux-continuum's own `continuum.tmux` prepends a
# `#(.../continuum_save.sh)` interpolation to `status-right` on every one
# of its own reloads; this ordering silently discards that write along
# with everything else tpm's plugins set. Losing it would also lose
# continuum's only auto-save trigger, so the matugen template
# (tmux-colors.conf) re-adds the same interpolation as an explicitly
# matugen-owned literal — see that template's header for the detail.
source-file -q ~/.local/state/theme/tmux-colors.conf

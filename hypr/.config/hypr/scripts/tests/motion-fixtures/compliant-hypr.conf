# motion-lint fixture (12-05, D-28; updated 13-01 Task 4 for the
# $motion_speed_*/$motion_curve_* reference shape).
# Derives from hypr/.config/hypr/config/animations.conf's `animations {}`
# block, using only bezier curve names and hyprlang variable names that
# ~/.local/state/theme/hyprland-motion.conf actually emits. Never sourced
# by any live Hyprland config — motion-lint self-test fixture only.
animations {
    bezier = motion-standard, 0.2, 0, 0, 1
    bezier = motion-emphasized-decelerate, 0.05, 0.7, 0.1, 1
    animation = windowsIn, 1, $motion_speed_standard, motion-emphasized-decelerate, popin 60%
}

# ╔══════════════════════════════════════════════════════╗
# ║               KEYBINDINGS (UWSM)                     ║
# ║  GUI apps launched via uwsm app -- for systemd       ║
# ║  scope isolation. Do NOT use 'exit' dispatcher —     ║
# ║  use 'uwsm stop' for clean session shutdown.         ║
# ╚══════════════════════════════════════════════════════╝

$mainMod = SUPER
$terminal = uwsm app -- kitty.desktop
$file_explorer = uwsm app -- thunar.desktop
$tui = uwsm app -- kitty --class yazi-fm --title "Yazi" -- yazi
$app_launcher = walker
# `-s <set>` panics walker 2.16.2 (src/data.rs:566, "can't find specified set") — do not revert to `-s`.
$app_launcher_drun = walker -m runner
# $app_launcher = uwsm app -- $(wofi --show drun --define=drun-print_desktop_file=true)
# $app_launcher_drun = wofi --show run
$lock_screen = uwsm app -- hyprlock
$code_Editor = uwsm app -- codium.desktop --enable-features=UseOzonePlatform --ozone-platform=wayland --log debug

# ── Core ─────────────────────────────────────────────
bind = $mainMod, Return, exec, $terminal # Open terminal
bind = $mainMod, E, exec, $file_explorer # Open file manager
bind = $mainMod, Y, exec, $tui # Open file manager (TUI)
bind = $mainMod, I, exec, $code_Editor # Open code editor
bind = $mainMod, Q, killactive # Close active window
bind = $mainMod SHIFT, Q, exec, ~/.config/hypr/scripts/wlogout.sh # Open power menu
bind = $mainMod, V, togglefloating # Toggle floating
bind = $mainMod, F, fullscreen, 0 # Toggle fullscreen
bind = $mainMod SHIFT, F, fullscreen, 1 # Toggle maximize
bind = $mainMod, P, pseudo # Toggle pseudotiling
# bind = $mainMod, J, togglesplit

# ── Launchers (walker as primary, wofi still available) ─
# D-01 three-way split: a bare Super tap is the menu alone (below), the
# app launcher moved to its own dedicated Super+Space bind, and Super+R
# (runner) stays exactly as-is. The tap-only mechanism is Hyprland's
# native default release-bind shadowing (D-02) — proven live by keypress
# in 07-04 Task 1 (see 07-04-SUMMARY.md) before this split was made.
#   tap Super  -> menu (main)
#   Super+Space -> app launcher (drun)
#   Super+R     -> app runner
bind = $mainMod, SPACE, exec, $app_launcher # Open app launcher
bind = $mainMod, R, exec, $app_launcher_drun # Open app runner
bindr = $mainMod, SUPER_L, exec, uwsm app -- walker -m menus:main # Open main menu (Super tap)

# ── Escape hatch (D-03) ──────────────────────────────
# Reserved, never-shadowed kill-bind. This exists so a future Super-bind
# experiment (plan 07-04) can never lock the keyboard: Escape carries no
# other $mainMod meaning anywhere in this file (confirmed via grep before
# this line was added), so it can never be shadowed by anything else here.
# Do NOT remove this bind because it "looks unused" — it is the escape
# hatch, tested and proven in isolation before any risky Super-tap change.
bind = $mainMod, Escape, exec, pkill walker # Emergency: force-close walker

# ── Custom menus ─────────────────────────────────────
# theme-switch.sh is a thin picker (D-01): it only prompts for a theme
# name, then delegates to the single engine entrypoint,
# ~/.config/theme-engine/theme-apply, for all rendering + reload.
bind = $mainMod, T, exec, ~/.config/hypr/scripts/theme-switch.sh # Switch theme
bind = $mainMod, B, exec, ~/.config/hypr/scripts/waybar-switch.sh # Switch waybar
# BAR-01/D-02/D-37: the ONLY bind that can clear a persistent
# fullscreen/gaming-hide -- targets the owner's `keybind toggle` verb
# (never hide/show directly), which carries the auto-clear-on-base-change
# override semantics (D-02).
bind = $mainMod SHIFT, B, exec, ~/.config/hypr/scripts/waybar-visibility.sh keybind toggle # Toggle waybar visibility
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper-switch.sh # Change wallpaper

# ── Clipboard ────────────────────────────────────────
bind = $mainMod, C, exec, cliphist list | walker --dmenu | cliphist decode | wl-copy # Open clipboard history
# UTIL-03/D-15 manual wipe entry — reachable without touching the Super+C
# flow above (destructive-safe default-No confirm lives in the script).
bind = $mainMod SHIFT, C, exec, ~/.config/hypr/scripts/clipboard-wipe.sh # Wipe clipboard history

# ── Screenshots ──────────────────────────────────────
# Omarchy-style Print-key family (D-05): freeze-capture into satty for
# annotate+save+copy (SHOT-01/02). Old Super+X/Z/Shift+Print binds
# removed — Super+X/Z freed for utilities (06-UI-SPEC D-32).
#
# Bound by physical keycode (code:107), not the Print keysym (06-14 gap
# closure). Keycode matching bypasses XKB keysym translation entirely,
# which deterministically fixes the ALT case: on the us XKB keymap
# <PRSC> is type PC_ALT_LEVEL2 with symbols [Print, Sys_Req], so holding
# Alt selects level 2 = Sys_Req and `ALT, Print` can never match — Alt
# never fires the keysym bind. Keycode binding is also robust against
# keyboards whose physical PrtSc key does not emit the `Print` keysym
# at all. If a live `wev` check shows the physical key does not emit
# keycode 107, the remedy is the keyboard's onboard/iCUE hardware
# profile — outside these dotfiles.
bind = , code:107, exec, ~/.config/hypr/scripts/capture-region.sh # Screenshot region
bind = SHIFT, code:107, exec, ~/.config/hypr/scripts/capture-window.sh # Screenshot window
bind = CTRL, code:107, exec, ~/.config/hypr/scripts/capture-full.sh # Screenshot full
bind = ALT, code:107, exec, ~/.config/hypr/scripts/record-toggle.sh # Toggle screen recording

# ── Utilities (D-32 — freed X/Z family, MENU-07 cheat-sheet source) ──
# Chord assignments (no strong mnemonic fit across all four — documented
# explicitly here for Phase 7's keybind cheat-sheet, per UI-SPEC
# Interaction Contract):
#   Super+Z       -> emoji picker (UTIL-01)
#   Super+Shift+Z -> icon-theme picker (UTIL-04)
#   Super+X       -> color picker (UTIL-02)
#   Super+Shift+X -> font switcher (UTIL-05)
#   Super+C stays the fifth utility (clipboard, already bound above)
bind = $mainMod, Z, exec, ~/.config/hypr/scripts/emoji-picker.sh # Emoji picker
bind = $mainMod SHIFT, Z, exec, ~/.config/hypr/scripts/icon-theme-switch.sh # Icon theme picker
bind = $mainMod, X, exec, ~/.config/hypr/scripts/color-picker.sh # Color picker
bind = $mainMod SHIFT, X, exec, ~/.config/hypr/scripts/font-switch.sh # Font switcher

# ── Notification center ──────────────────────────────
bind = $mainMod, N, exec, swaync-client -t -sw # Toggle notification center

# ── Lock screen ──────────────────────────────────────
bind = $mainMod, L, exec, $lock_screen # Lock screen

# ── Move focus ───────────────────────────────────────
bind = $mainMod, left, movefocus, l # Focus window left
bind = $mainMod, right, movefocus, r # Focus window right
bind = $mainMod, up, movefocus, u # Focus window up
bind = $mainMod, down, movefocus, d # Focus window down

# ── Move windows ─────────────────────────────────────
bind = $mainMod SHIFT, left, movewindow, l # Move window left
bind = $mainMod SHIFT, right, movewindow, r # Move window right
bind = $mainMod SHIFT, up, movewindow, u # Move window up
bind = $mainMod SHIFT, down, movewindow, d # Move window down

# ── Resize windows ───────────────────────────────────
binde = $mainMod CTRL, left, resizeactive, -30 0 # Resize window narrower
binde = $mainMod CTRL, right, resizeactive, 30 0 # Resize window wider
binde = $mainMod CTRL, up, resizeactive, 0 -30 # Resize window shorter
binde = $mainMod CTRL, down, resizeactive, 0 30 # Resize window taller

# ── Switch workspaces ────────────────────────────────
bind = $mainMod, 1, workspace, 1 # Switch to workspace 1
bind = $mainMod, 2, workspace, 2 # Switch to workspace 2
bind = $mainMod, 3, workspace, 3 # Switch to workspace 3
bind = $mainMod, 4, workspace, 4 # Switch to workspace 4
bind = $mainMod, 5, workspace, 5 # Switch to workspace 5
bind = $mainMod, 6, workspace, 6 # Switch to workspace 6
bind = $mainMod, 7, workspace, 7 # Switch to workspace 7
bind = $mainMod, 8, workspace, 8 # Switch to workspace 8
bind = $mainMod, 9, workspace, 9 # Switch to workspace 9
bind = $mainMod, 0, workspace, 10 # Switch to workspace 10

# ── Move to workspace ────────────────────────────────
bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Move window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # Move window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # Move window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # Move window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # Move window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 # Move window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 # Move window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 # Move window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 # Move window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 # Move window to workspace 10

# ── Special workspace (scratchpad) ───────────────────
bind = $mainMod, S, togglespecialworkspace, magic # Toggle scratchpad
bind = $mainMod SHIFT, S, movetoworkspace, special:magic # Move window to scratchpad

# ── Scroll through workspaces ────────────────────────
bind = $mainMod, mouse_down, workspace, e+1 # Next workspace
bind = $mainMod, mouse_up, workspace, e-1 # Previous workspace

# ── Mouse bindings ───────────────────────────────────
bindm = $mainMod, mouse:272, movewindow # Drag to move window
bindm = $mainMod, mouse:273, resizewindow # Drag to resize window

# ── Audio controls ───────────────────────────────────
# OSD-01/D-23: routed through swayosd-client so the themed pill (D-24)
# shows on every change; mute AND mic-mute both go through swayosd-client.
# Caps-lock OSD is keyless — handled by swayosd-libinput-backend.service
# (enabled in install.sh, D-23), no keybind needed here.
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise # Raise volume
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower # Lower volume
bindel = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle # Mute audio
bindel = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle # Mute microphone


# ── Brightness ───────────────────────────────────────
# OSD-01/D-24: routed through swayosd-client so brightness gets the same
# themed pill as volume. swayosd-client drives the same backlight path
# brightnessctl did, so D-25's descope still holds: DDC (external-monitor)
# brightness stays out of scope — this is the laptop-backlight path only.
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise # Raise brightness
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower # Lower brightness

# ── Media controls ───────────────────────────────────
bindl = , XF86AudioNext, exec, playerctl next # Next track
bindl = , XF86AudioPause, exec, playerctl play-pause # Toggle play/pause
bindl = , XF86AudioPlay, exec, playerctl play-pause # Toggle play/pause
bindl = , XF86AudioPrev, exec, playerctl previous # Previous track

# Scroll nicely in the terminal
windowrule = match:class kitty, scroll_touchpad 1.5
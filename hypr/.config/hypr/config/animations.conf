# ╔══════════════════════════════════════════════════════╗
# ║                 ANIMATIONS                            ║
# ║          Smooth, fluid motion design                  ║
# ╚══════════════════════════════════════════════════════╝

animations {
    # D-08/D-22: $motion_enabled is defined by hyprland-motion.conf, sourced
    # immediately before this file (hyprland.conf) — this block deliberately
    # owns `enabled` while the generated block does not, since whichever
    # animations {} block came last would otherwise clobber it. At
    # motion-scale "off" this resolves false, disabling animation at the
    # toolkit level rather than shrinking durations (D-08).
    enabled = $motion_enabled

    # 13-01/MOTION-01: every bezier curve declaration is gone — all twelve
    # (4 byte-identical duplicates of motion.json's MD3 base easings, 3
    # declared-but-never-referenced dead curves, 5 hand-authored character
    # curves replaced per D-09) now resolve from
    # ~/.local/state/theme/hyprland-motion.conf's engine-emitted
    # `bezier = motion-<name>, ...` block, sourced immediately before this
    # file (hyprland.conf). 13-07: the D-21 A/B curve-comparison toggle
    # (the removed per-slot curve variable family) has been removed — the
    # soak gate that would have driven a retune was waived by explicit
    # operator decision (see 13-MOTION-SOAK-VERDICT.md) rather than
    # passed, so each slot below is pinned to the toggle's former
    # MD3-default mapping as it stood at removal, written as a literal
    # engine-emitted curve name rather than a variable. The five
    # hand-authored character curves (D-12's marked non-MD3 set) were
    # deleted from motion.json alongside this, since no retune ever
    # adopted any of them.

    # ── Window animations ────────────────────────────
    animation = windowsIn,   1, $motion_speed_emphasized_in,  motion-emphasized-decelerate, popin 60%
    animation = windowsOut,  1, $motion_speed_emphasized_out, motion-emphasized-accelerate, popin 60%
    animation = windowsMove, 1, $motion_speed_standard,       motion-standard, slide

    # ── Fade ─────────────────────────────────────────
    animation = fadeIn,     1, $motion_speed_emphasized_in,  motion-standard-decelerate
    animation = fadeOut,    1, $motion_speed_emphasized_out, motion-standard-accelerate
    animation = fadeSwitch, 1, $motion_speed_standard,       motion-standard
    animation = fadeShadow, 1, $motion_speed_standard,       motion-standard
    animation = fadeDim,    1, $motion_speed_standard,       motion-standard

    # ── Border ───────────────────────────────────────
    animation = border,      1, $motion_speed_ambient,                  motion-linear
    animation = borderangle, 1, $motion_speed_indicator_border_rotate,  motion-linear, loop

    # ── Workspace transitions ────────────────────────
    animation = workspaces,       1, $motion_speed_emphasized_in, motion-emphasized-decelerate, slide
    animation = specialWorkspace, 1, $motion_speed_emphasized_in, motion-emphasized-decelerate, slidevert

    # ── Layers (menus, notifications) — D-07 split: layersIn/layersOut ──
    # carry their own emphasized-in/emphasized-out speed+curve (300ms
    # decelerate in, 150ms accelerate out); the parent `layers` entry stays
    # declared per the animation tree's inheritance semantics even though
    # every real case is now covered by the two children (13-RESEARCH.md
    # Open Question 2).
    animation = layers,    1, $motion_speed_standard,       motion-standard,              popin 80%
    animation = layersIn,  1, $motion_speed_emphasized_in,  motion-emphasized-decelerate, popin 80%
    animation = layersOut, 1, $motion_speed_emphasized_out, motion-emphasized-accelerate, popin 80%
}

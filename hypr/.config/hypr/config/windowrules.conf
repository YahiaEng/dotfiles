# ╔══════════════════════════════════════════════════════╗
# ║                 WINDOW RULES                         ║
# ║          Hyprland 0.54+ syntax (match:)              ║
# ╚══════════════════════════════════════════════════════╝

# ── Float rules (grouped with named rules) ───────────

windowrule {
    name = float-pavucontrol
    match:class = ^(pavucontrol)$
    float = on
    size = 800 600
    center = on
}

windowrule {
    name = float-blueman
    match:class = ^(blueman-manager)$
    float = on
    size = 800 600
    center = on
}

windowrule = float on, match:class ^(nm-applet)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$
windowrule = float on, match:class ^(org\.gnome\.Calculator)$
windowrule = float on, match:class ^(org\.gnome\.Settings)$
windowrule = float on, match:class ^(imv)$
windowrule = float on, match:class ^(mpv)$

# Thunar dialogs
windowrule = float on, match:class ^(thunar)$, match:title ^(File Operation Progress)$
windowrule = float on, match:class ^(thunar)$, match:title ^(Confirm)

# ── Picture in picture ───────────────────────────────

windowrule {
    name = pip-rules
    match:title = [Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture
    float = on
    pin = on
    size = 480 270
    move = (monitor_w-490) (monitor_h-280)
}

# ── Wallpaper picker (floating kitty) ────────────────

windowrule {
    name = wallpaper-picker
    match:class = ^(wallpaper-picker)$
    float = on
    size = 85% 85%
    center = on
    animation = popin
}

windowrule {
    name = icon-theme-picker
    match:class = ^(icon-theme-picker)$
    float = on
    size = 85% 85%
    center = on
    animation = popin
}

windowrule {
    name = font-switcher
    match:class = ^(font-switcher)$
    float = on
    size = 85% 85%
    center = on
    animation = popin
}

windowrule {
    name = network-manager
    match:class = ^(network-manager)$
    float = on
    size = 85% 85%
    center = on
    animation = popin
}

windowrule {
    name = cheat-sheet
    match:class = ^(cheat-sheet)$
    float = on
    size = 85% 85%
    center = on
    animation = popin
}

# ── Yazi file manager (floating kitty) ───────────────

windowrule {
    name = yazi-fm
    match:class = ^(yazi-fm)$
    float = on
    size = 70% 65%
    center = on
    animation = popin
}

# ── AI Dashboard kitty surfaces (MENU-03, D-21/D-24) ─
# Unlike Zen (see the big comment block below), kitty's --class is set at
# spawn time and known immediately, so a plain class-based workspace
# assignment works correctly here (no title-timing problem) — verified
# live against the same instrumentation used for the Zen finding.
windowrule {
    name = ai-claude-code
    match:class = ^(ai-claude-code)$
    workspace = name:ai
}

windowrule {
    name = ai-local-models
    match:class = ^(ai-local-models)$
    workspace = name:ai
}

# ── AI Dashboard web-app windows (MENU-03, D-21) — NO windowrule needed ──
# Zen assigns EVERY window the identical class "zen" regardless of the URL
# loaded (confirmed live 2026-07-13, hyprctl clients -j: a plain --new-window
# https://claude.ai launch reports class=zen, initialClass=zen). RESEARCH
# Assumption A1 asked whether MOZ_APP_REMOTINGNAME=<name> (Firefox 124+'s
# documented app_id override) changes that on THIS Zen build — tested live:
# `MOZ_APP_REMOTINGNAME=zen-claude zen-browser --new-window https://claude.ai`
# produced a window with class/initialClass STILL "zen" (unchanged) and the
# SAME pid as a plain pre-existing Zen window. Root cause: Zen is single-
# instance — a second `zen-browser` invocation just asks the already-running
# master process to open a new window; it never re-reads its own env. A1 is
# CLOSED: the env var has no effect here, on this build, for this reason.
#
# A title-regex windowrule (the plan's originally intended fallback) was
# tried and PROVEN NOT TO WORK for placement, one level deeper than A1's own
# caveat anticipated: `hyprctl clients -j` shows `initialTitle` is the
# generic "Zen Browser" for EVERY new window regardless of URL — the page
# title ("Sign in - Claude — Zen Browser" etc.) only arrives after the page
# loads, which is AFTER Hyprland's one-shot `workspace` rule dispatch has
# already run against the window's map-time state. Confirmed live: a
# `windowrule = workspace name:ai, match:class ^(zen)$, match:title .*Claude.*`
# rule never moved the window even minutes after its title had fully updated
# to match — workspace-assignment rules do not get re-evaluated on later
# title-change events the way continuous properties like opacity/float do.
#
# The mechanism that DOES work, verified live: Hyprland spawns a new window
# on whichever workspace is currently ACTIVE at spawn time. Placement is
# therefore done by the menu's own launch action switching to `name:ai`
# FIRST (`hyprctl dispatch workspace name:ai`), THEN launching zen-browser —
# no windowrule involved. This is also a cleaner Pitfall-4 regression fix
# than title-matching: a normal Zen window opened without that workspace-
# switch preamble is untouched by construction, not merely by regex
# non-match. Live-verified: a Claude-URL launch after switching to name:ai
# landed there; a plain non-AI-URL launch made from workspace 2 (no switch)
# stayed on workspace 2. Implemented in ai-dashboard.toml's Zen entries via
# ai-webapp-launch.sh (plan 07-06).
#
# Titles for all four services were verified live (2026-07-13), documented
# here for any future script that DOES need to identify these windows by
# content after they've loaded:
#   Claude      -> "Sign in - Claude — Zen Browser"
#   ChatGPT     -> "ChatGPT — Zen Browser"
#   Gemini      -> "Google Gemini — Zen Browser"
#   Perplexity  -> "Perplexity — Zen Browser"

# ── Opacity rules ────────────────────────────────────

windowrule = opacity 0.88 0.85, match:class ^(kitty)$
windowrule = opacity 0.92 0.90, match:class ^(yazi-fm)$
windowrule = opacity 0.90 0.88, match:class ^(thunar)$
windowrule = opacity 0.90 0.88, match:class ^(code-url-handler)$
windowrule = opacity 0.90 0.88, match:class ^(Code)$
windowrule = opacity 0.90 0.88, match:class ^(codium-url-handler)$
windowrule = opacity 0.90 0.88, match:class ^(codium)$
windowrule = opacity 0.90 0.88, match:class ^(zen)$

# ── Blur rules ───────────────────────────────────────

windowrule = no_blur on, match:class ^(firefox)$
#windowrule = no_blur on, match:class ^(zen)$
windowrule = no_blur on, match:class ^(chromium)$

# ── Layer rules (walker, wofi, waybar, swaync, wlogout)

layerrule = blur on, match:namespace walker
layerrule = blur on, match:namespace wofi
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = blur on, match:namespace logout_dialog
# eww media popup (BAR-04). Its defwindow sets :namespace "eww-media-popup"
# (eww 0.6.0 supports it), so this targets ONLY the media popup, not every
# gtk-layer-shell surface. Paired with a translucent .media-center bg in
# eww.scss so the blur has something to frost through.
layerrule = blur on, match:namespace eww-media-popup
# AGS media applet (10-04, MEDIA-02). Astal.Window sets namespace
# "ags-media" (10-02); targets ONLY this window, mirroring the
# eww-media-popup rule above. Paired with the translucent .media-scrim /
# .media-controls backgrounds in ags/style.scss so the blur has something
# to frost through.
layerrule = blur on, match:namespace ags-media

layerrule = ignore_alpha 0.5, match:namespace walker
layerrule = ignore_alpha 0.5, match:namespace wofi
layerrule = ignore_alpha 0.5, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace eww-media-popup
# Matches the shared 0.5 default used by every other namespace above. An
# earlier draft (10-06c) lowered .media-scrim to rgba($background, 0.25) and
# correspondingly dropped this threshold to 0.2 to chase a stronger frost —
# but with .media-bg-art layered underneath at 0.35 too, that put most of
# the card's composited alpha BELOW the blur cutoff, so it rendered as raw
# unblurred transparency rather than frosted glass. Reverted: the composited
# card background (.media-bg-art 0.35 + .media-scrim 0.55 on top, ~0.71
# effective) is comfortably above this 0.5 threshold, so the card stays both
# blurred and clickable while still reading as genuinely frosted.
layerrule = ignore_alpha 0.5, match:namespace ags-media
# wlogout's scrim is a single uniform-alpha fill, so ignore_alpha acts as an
# all-or-nothing blur switch for the whole backdrop: at the shared 0.5 the
# 0.45 scrim falls BELOW the threshold and the desktop is not blurred at all.
# Kept at 0.3 so the scrim still blurs. Blur STRENGTH is decoration:blur and is
# global — it cannot be set per-layer — so the scrim alpha is the only
# wlogout-local control over how much desktop reads through.
layerrule = ignore_alpha 0.3, match:namespace logout_dialog
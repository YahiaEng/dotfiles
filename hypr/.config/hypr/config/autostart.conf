# ╔══════════════════════════════════════════════════════╗
# ║                  AUTOSTART (UWSM)                    ║
# ║  All apps launched via uwsm app -- for proper        ║
# ║  systemd scope isolation and session management.     ║
# ╚══════════════════════════════════════════════════════╝

# ── Export env to dbus AND systemd user session FIRST ─
# Both are needed: dbus for portals, systemd for uwsm app scopes
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE GTK_THEME XCURSOR_THEME XCURSOR_SIZE
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE GTK_THEME XCURSOR_THEME XCURSOR_SIZE

# ── Wallpaper daemon ─────────────────────────────────
exec-once = uwsm app -- awww-daemon

# ── Status bar ───────────────────────────────────────
exec-once = uwsm app -- ~/.config/hypr/scripts/waybar-launch.sh

# ── Notification daemon ──────────────────────────────
exec-once = uwsm app -- swaync

# ── Application launcher (elephant backend + walker) ─
exec-once = uwsm app -- elephant
exec-once = uwsm app -- walker --gapplication-service

# ── Idle daemon ──────────────────────────────────────
exec-once = uwsm app -- hypridle

# ── SwayOSD (OSD-01/D-23/D-24) ───────────────────────
# swayosd-client (bound to XF86Audio*/mic-mute keys in keybinds.conf)
# is a thin D-Bus client with nothing to talk to until this server
# runs; it performs the actual volume/mute change AND renders the
# themed OSD pill from style.css. Launched here, before theme-init,
# so the pill is themed on first paint. The keyless caps-lock OSD is
# handled separately by the packaged swayosd-libinput-backend.service
# (system bus, enabled in install.sh).
exec-once = uwsm app -- swayosd-server

# ── Polkit agent ─────────────────────────────────────
exec-once = uwsm app -- /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ── Clipboard ────────────────────────────────────────
# UTIL-03/D-15: -max-items caps history at ~100 entries (default is 750)
# so plaintext secrets don't accumulate unbounded; paired with a
# session-end wipe (wlogout logout/shutdown/reboot actions) and a manual
# wipe entry (clipboard-wipe.sh, Super+Shift+C) — Security Domain
# Information Disclosure mitigation, ships in the same wave as the cap.
exec-once = uwsm app -- wl-paste --type text --watch cliphist -max-items 100 store
exec-once = uwsm app -- wl-paste --type image --watch cliphist -max-items 100 store

# ── Apply last theme on login (wait for daemons to be ready) ──
# theme-init.sh is a thin caller (D-01): it only reads the saved theme
# (~/.local/state/theme/current-theme, falling back to catppuccin, D-10)
# and sets the wallpaper, then delegates to
# ~/.config/theme-engine/theme-apply for all rendering + reload.
exec-once = sleep 2 && ~/.config/hypr/scripts/theme-init.sh

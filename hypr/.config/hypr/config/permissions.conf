# ╔══════════════════════════════════════════════════════╗
# ║              PERMISSIONS (D-12, 11-05)                ║
# ║   Hyprland's dynamic-client permission manager        ║
# ╚══════════════════════════════════════════════════════╝
#
# Verified directly against the installed Hyprland 0.56.0 binary
# (/usr/bin/Hyprland, commit 36b2e0cfe0c6094dbc47bd42a437431315bb3087) via
# `strings` — NOT copied from documentation. The binary embeds Hyprland's
# own example config (its `hl.permission(...)` Lua helper form) plus this
# exact literal warning, quoted verbatim:
#
#   "Please note permission changes here require a Hyprland restart and
#    are not applied on-the-fly, for security reasons"
#
# Confirmed facts (full verification transcript in
# 11-QUICKSHELL-EVIDENCE.md, "Criterion 5 — screencopy feasibility"):
#   - The registered config-var is `ecosystem:enforce_permissions`,
#     default false (unrestricted) — this file is a no-op until flipped.
#   - The permission TYPE string for screen-capture is exactly
#     `screencopy` (lowercase); Hyprland's own shipped example also shows
#     a `plugin` type (unrelated to this file).
#   - The mode used here is `allow` only — never `ask` (D-12/T-11-20:
#     `ask` depends on an unresolved `hyprland-guiutils` popup-UI package
#     question, irrelevant to a feasibility probe; `deny` is never wanted
#     for a client this repo itself wants to work).
#   - Grants are read ONCE at compositor startup. `hyprctl reload` does
#     NOT apply a change here — a full Hyprland restart is required,
#     confirmed directly from the binary string above, not assumed.
#
# This is NOT the standalone permissions config file the pre-11-05
# ROADMAP wording named — that filename does not exist as a distinct
# concept on 0.56.0 (see criterion 5's amendment in ROADMAP.md). The
# real mechanism is this ordinary sourced `.conf` module: one
# `permission = <path>, <type>, <mode>` line per client, plus the
# `ecosystem { }` category block below.
#
# WHAT IS AND ISN'T VERIFIED (read before Phase 16 relies on this file):
#   - The MECHANISM (keyword syntax, type/mode strings, the
#     restart-not-reload requirement) is verified directly against the
#     installed binary, as above.
#   - Every client identifier below is verified to be the CORRECT
#     binary for its consumer (`pacman -Ql`/`strings`/`pgrep` — see each
#     entry's own comment) — this is consumer *identification*, not a
#     live enforcement test.
#   - Live enforcement itself — that setting `enforce_permissions = true`
#     actually admits these exact clients and denies everyone else — was
#     DELIBERATELY NOT exercised in Phase 11. Testing it requires a full
#     Hyprland restart, and this machine's operator session runs AS A
#     CHILD PROCESS of the compositor (`Hyprland → kitty → fish →
#     claude`); the restart would have killed the verification session
#     itself. The human operator explicitly chose to skip the live
#     restart test rather than accept that risk (2026-07-26). Phase 16
#     (OVER-04) must perform the live enforcement proof itself before
#     depending on this file's allow list being correct in practice.
#
# SHIPS INERT: `enforce_permissions` is `false` below, so none of the
# above is active on this build. Phase 16 activates this file by
# flipping the single value below to `true` and restarting Hyprland —
# no other edit is required, but per the paragraph above, Phase 16 must
# still verify live enforcement itself; this file only proves the
# mechanism and the consumer list, not that the mechanism works end-to-end.
#
# T-11-20 (Elevation of Privilege): every client identifier below is the
# EXACT absolute binary path, verified via `pacman -Ql`/`strings`/`pgrep`
# — never a wildcard, `?`, `[`, `|` or `.*` — even though Hyprland's own
# shipped example uses a regex alternation for the same binaries. A
# looser pattern could let an unrelated binary in the same directory
# inherit a grant meant for one specific tool.

ecosystem {
    enforce_permissions = false
}

# Quickshell — this repo's own screencopy probe (criterion 5, D-12).
permission = /usr/bin/quickshell, screencopy, allow

# ── Pre-existing screencopy consumers on this machine (T-11-21) ──────
# Enabling enforcement without these would break screenshots/screen-share
# — a real regression against standing constraint 4's additive-only rule.
#
#   - grim: the actual capture binary invoked internally by hyprshot for
#     all four screenshot keybinds (capture-region.sh/-window.sh/-full.sh
#     all call `hyprshot`, which is a bash wrapper — verified via
#     `file`/`grep` on /usr/bin/hyprshot that it calls `grim -g ...`
#     itself; hyprshot issues no screencopy protocol calls of its own,
#     so hyprshot's own binary path would be the wrong client identifier).
permission = /usr/bin/grim, screencopy, allow
#   - hyprpicker: confirmed via `strings /usr/bin/hyprpicker` to link
#     `zwlr_screencopy_manager_v1` directly (used for the Super+X color
#     picker and for record-toggle.sh's freeze-preview). Not named in
#     this plan's own text — found during this task's consumer
#     enumeration and added proactively (Rule 2: a real, disclosed
#     screencopy consumer this host already runs on a keybind).
permission = /usr/bin/hyprpicker, screencopy, allow
#   - xdg-desktop-portal-hyprland: the actual running backend binary,
#     confirmed via `pgrep -af xdg-desktop-portal` against the live
#     process (`/usr/lib/xdg-desktop-portal-hyprland`) — NOT
#     `/usr/bin/hyprland-share-picker`, a separate picker-UI helper
#     shipped in the same package. This is the process that answers
#     `org.freedesktop.impl.portal.ScreenCast` for screen sharing
#     (confirmed: `hyprland.portal`'s `Interfaces=` line lists
#     `ScreenCast`, and `hyprland.portal`'s `DBusName=` matches the
#     running `/usr/lib/xdg-desktop-portal-hyprland` process, not
#     `xdg-desktop-portal-gtk`).
permission = /usr/lib/xdg-desktop-portal-hyprland, screencopy, allow

# ── Checked and deliberately excluded ────────────────────────────────
#   - slurp: confirmed via `strings /usr/bin/slurp` to carry NO
#     `screencopy` protocol references at all — it is a pure
#     region-selection overlay (outputs "X,Y WxH" text); the actual
#     freeze/capture in every script that uses it is done by a separate
#     tool (grim or hyprpicker, both already allowed above).
#   - gpu-screen-recorder (record-toggle.sh, SHOT-03): `strings` on its
#     binary shows no direct `screencopy` protocol reference — it likely
#     captures via KMS/DRM (`gsr-kms-server`) or the portal's own
#     ScreenCast path (already covered by the portal entry above) rather
#     than the `wlr-screencopy` protocol directly, but this was NOT
#     independently confirmed live under enforcement in this plan (out
#     of this plan's <human-check> scope). Flagged, not guessed at —
#     verify before Phase 16 relies on it if screen recording is ever
#     exercised under enforcement.

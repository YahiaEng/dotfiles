# ╔══════════════════════════════════════════════════════╗
# ║                   HYPRLOCK                            ║
# ╚══════════════════════════════════════════════════════╝

source = ~/.local/state/theme/hyprlock.conf

# NOTE (FIX-02, hyprlock 0.9.x option migration):
# - `grace` is no longer a config option (CLI-only `--grace`, default 0). No invocation
#   in this repo passes --grace, so the lock always requires a password immediately.
# - `no_fade_in`/`no_fade_out` were replaced by the animations{} block below.
# - `immediate_render` commits the lock surface without waiting for resources, shrinking
#   the startup window during which typed keys can't reach the password buffer.
# - `ignore_empty_input` (FIX-02 gap closure, UAT Test 2 / D-23): ENTER on an empty
#   password buffer is ignored outright, so no empty password is ever submitted to PAM.
#   This eliminates the ~2-3s input-blocked window (pam_unix failure delay) during which
#   real keystrokes were silently dropped, and stops pam_faillock tally growth from
#   repeated empty submits.
general {
    hide_cursor = true
    immediate_render = true
    ignore_empty_input = true
}

# ── Animations ───────────────────────────────────────
# fadeIn disabled (FIX-02): the lock screen appears at full opacity the instant the
# session is locked, so the visual "you can type now" cue matches when input actually
# registers. fadeOut and input-field animations keep their defaults.
animations {
    enabled = true
    animation = fadeIn, 0
}

# ── Background ───────────────────────────────────────
# Re-tuned for the busier LOCK-01 layout (D-13): stronger blur + lower
# brightness + a touch of vibrancy_darkness keeps the extra avatar/now-playing/
# battery/capslock/failed-attempts text legible over the wallpaper without
# losing the wallpaper's identity.
background {
    monitor =
    path = $image
    blur_passes = 4
    blur_size = 10
    noise = 0.02
    contrast = 0.95
    brightness = 0.5
    vibrancy = 0.15
    vibrancy_darkness = 0.1
}

# ── Avatar (themed initial, D-12) ─────────────────────
# No photo asset, no ~/.face dependency: a themed circle (hyprlock's native
# shape widget, CShape) filled in $surface with a $primary border, with the
# user's first initial rendered on top as a bold glyph label. $USER's first
# character is uppercased once via cmd[] (the username doesn't change during
# a lock session, so a long update interval matches the Date label's
# convention below).
shape {
    monitor =
    size = 90, 90
    color = $surface
    rounding = -1
    border_size = 2
    border_color = $primary
    position = 0, 280
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] echo "${USER:0:1}" | tr '[:lower:]' '[:upper:]'
    color = $primary
    font_size = 40
    font_family = FiraCode Nerd Font Bold
    position = 0, 280
    halign = center
    valign = center
}

# ── Time ─────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = $primary
    font_size = 96
    font_family = FiraCode Nerd Font Bold
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 4
}

# ── Date ─────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d"
    color = $on_surface
    font_size = 22
    font_family = FiraCode Nerd Font
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# ── Now-playing (playerctl, D-11) ─────────────────────
# Naturally empty (and so invisible) when nothing is playing — playerctl
# exits non-zero with no stdout when there's no active player, and an empty
# label text renders nothing.
label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format "{{artist}} - {{title}}" 2>/dev/null
    color = $on_surface
    font_size = 14
    font_family = FiraCode Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# ── Greeting ─────────────────────────────────────────
label {
    monitor =
    text = Hi, $USER
    color = $secondary
    font_size = 18
    font_family = FiraCode Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# ── Password input ───────────────────────────────────
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = $primary
    inner_color = $surface
    font_color = $on_surface
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="##a6adc8">  Enter Password...</span>
    hide_input = false
    rounding = 12
    check_color = $tertiary
    # check_text (FIX-02 gap closure, T-04-09 defense-in-depth): renders a visible
    # "checking" cue during any legitimate in-flight PAM verification (e.g. a wrong
    # password), so the keyboard is never a silent dead input during that ~2-3s window.
    check_text = <i>Checking...</i>
    fail_color = $error
    fail_text = <i>$FAIL</i>
    # fail_transition removed (FIX-02): option no longer exists in hyprlock 0.9.x —
    # the fail-color transition is handled by the inputFieldColors animation (default).
    capslock_color = $secondary
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -120
    halign = center
    valign = center
    shadow_passes = 2
}

# ── Battery + caps-lock row (D-11) ────────────────────
# Battery: reads the standard sysfs capacity file; gracefully empty (hidden)
# on desktop hardware with no BAT* device, same degrade-to-empty convention
# as now-playing above. Caps-lock: reads the LED brightness sysfs node as a
# small status word alongside the input-field's own capslock_color border cue.
label {
    monitor =
    text = cmd[update:30000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | awk '{print $1"%"}'
    color = $on_surface
    font_size = 14
    font_family = FiraCode Nerd Font
    position = -60, -190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] cat /sys/class/leds/*capslock/brightness 2>/dev/null | grep -q '^1$' && echo "⇪ CAPS"
    color = $secondary
    font_size = 14
    font_family = FiraCode Nerd Font
    position = 60, -190
    halign = center
    valign = center
}

# ── Failed-attempts counter ───────────────────────────
# $ATTEMPTS is hyprlock's own built-in failed-auth counter variable.
label {
    monitor =
    text = Attempts: $ATTEMPTS
    color = $error
    font_size = 14
    font_family = FiraCode Nerd Font
    position = 0, -220
    halign = center
    valign = center
}

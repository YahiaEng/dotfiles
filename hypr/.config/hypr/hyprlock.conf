# ╔══════════════════════════════════════════════════════╗
# ║                   HYPRLOCK                            ║
# ╚══════════════════════════════════════════════════════╝

source = ~/.local/state/theme/hyprlock.conf

# NOTE (FIX-02, hyprlock 0.9.x option migration):
# - `grace` is no longer a config option (CLI-only `--grace`, default 0). No invocation
#   in this repo passes --grace, so the lock always requires a password immediately.
# - `no_fade_in`/`no_fade_out` were replaced by the animations{} block below.
# - `immediate_render` commits the lock surface without waiting for resources, shrinking
#   the startup window during which typed keys can't reach the password buffer.
# - `ignore_empty_input` (FIX-02 gap closure, UAT Test 2 / D-23): ENTER on an empty
#   password buffer is ignored outright, so no empty password is ever submitted to PAM.
#   This eliminates the ~2-3s input-blocked window (pam_unix failure delay) during which
#   real keystrokes were silently dropped, and stops pam_faillock tally growth from
#   repeated empty submits.
general {
    hide_cursor = true
    immediate_render = true
    ignore_empty_input = true
}

# ── Animations ───────────────────────────────────────
# fadeIn disabled (FIX-02): the lock screen appears at full opacity the instant the
# session is locked, so the visual "you can type now" cue matches when input actually
# registers. fadeOut and input-field animations keep their defaults.
animations {
    enabled = true
    animation = fadeIn, 0
}

# ── Background ───────────────────────────────────────
# Re-tuned for the busier LOCK-01 layout (D-13): stronger blur + lower
# brightness + a touch of vibrancy_darkness keeps the extra avatar/now-playing/
# battery/capslock/failed-attempts text legible over the wallpaper without
# losing the wallpaper's identity.
#
# FIX (checkpoint re-diagnosis): `$image` is never defined by the sourced
# hyprlock-colors.conf render target (06-02 explicitly omitted it — matugen
# 4.1.0 cannot populate the image color context, same documented limitation
# as hyprland-colors.conf's blank `$image =`; 06-02-SUMMARY.md explicitly
# deferred this wiring to 06-04). Using the undefined `$image` var here
# meant the background never actually resolved to the wallpaper. Fixed by
# pointing directly at the same always-current symlink theme-init.sh and
# wallpaper.sh already maintain (D-19: wallpaper-setting is owned by the
# picker/init, never by matugen) — no template plumbing needed.
#
# D-19-45: pointer moved from the stow-managed Wallpapers directory into
# engine-owned state — same symlink, new home.
background {
    monitor =
    path = ~/.local/state/theme/current.jpg
    blur_passes = 4
    blur_size = 10
    noise = 0.02
    contrast = 0.95
    brightness = 0.5
    vibrancy = 0.15
    vibrancy_darkness = 0.1
}

# ── Avatar: REMOVED (checkpoint feedback) ─────────────
# D-12's themed-circle avatar (shape{} + initial label{}) was rejected by
# the user at the live-lock checkpoint ("user rejected avatar at checkpoint")
# and deleted outright — both the CShape circle and its initial-glyph label.
# No repositioning of Time/Date/Now-playing/Greeting was needed: the avatar
# sat at y=330, above all remaining elements (Time's the next-highest at
# y=180), so removing it only frees empty space above the stack rather than
# opening a gap between two surviving elements. Positions below are
# unchanged from 37ad716.

# ── Time ─────────────────────────────────────────────
# FIX (checkpoint re-diagnosis): $TIME -> $TIME12 (12-hour format request).
# Verified hyprlock 0.9.5 ships a native $TIME12 substitution (confirmed via
# `strings /usr/bin/hyprlock | grep TIME12` and cross-checked against the
# installed version's own source, IWidget.cpp's formatString(): $TIME12
# renders via getTime12h(), a HH:MM AM/PM string with 12-hour wraparound and
# zero-padded minutes) — no cmd[]/date fallback needed. Font/size/position/
# shadows unchanged from 37ad716.
label {
    monitor =
    text = $TIME12
    color = $primary
    font_size = 96
    font_family = FiraCode Nerd Font Bold
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 4
}

# ── Date ─────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d"
    color = $on_surface
    font_size = 22
    font_family = FiraCode Nerd Font
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# ── Now-playing (playerctl, D-11) ─────────────────────
# Naturally empty (and so invisible) when nothing is playing — playerctl
# exits non-zero with no stdout when there's no active player, and an empty
# label text renders nothing.
# FIX (checkpoint re-diagnosis): added shadow_passes/shadow_size — 06-PATTERNS.md
# explicitly calls for copying the Time/Date shadow convention onto every new
# indicator label (missing here originally), needed for legibility against
# the blurred wallpaper in both light and dark themes.
#
# FIX (checkpoint re-diagnosis, ROOT CAUSE of the stray "sample text" bug):
# the original `playerctl --format "{{artist}} - {{title}}"` put literal
# mustache-style double curly braces into this label's `text` value.
# Verified via a safe non-locking parse-only harness (fake $WAYLAND_DISPLAY,
# so hyprlock parses config + logs, then fails on the display connection
# before ever touching the real session) that hyprlang chokes on ANY `{{`
# inside a `text` value — it logs `Invalid expression type: supported +,
# -, */` and then "Proceeds ignoring faulty entries", silently discarding
# our text override and leaving this label on hyprlock's built-in schema
# default for `label`/`text`, which is the literal string "Sample Text"
# (confirmed at ConfigManager.cpp:343 in the matching 0.9.5 source and via
# `strings /usr/bin/hyprlock | grep -A1 -B1 "Sample Text"`). A single
# non-doubled `{...}` (e.g. the awk block in the battery label below) does
# NOT trigger this — only playerctl's `{{ }}` template syntax does. Fixed
# by dropping `--format` entirely and concatenating artist/title in a
# brace-free `sh -c` one-liner; re-verified clean (zero "Config has
# errors") against the same harness before committing.
label {
    monitor =
    text = cmd[update:2000] sh -c 'artist=$(playerctl metadata artist 2>/dev/null); title=$(playerctl metadata title 2>/dev/null); [ -n "$artist" ] && [ -n "$title" ] && echo "$artist - $title"'
    color = $on_surface
    font_size = 14
    font_family = FiraCode Nerd Font
    position = 0, 40
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# ── Greeting ─────────────────────────────────────────
# FIX (checkpoint re-diagnosis): added shadow_passes/shadow_size — flagged
# explicitly by the checkpoint's legibility directive ("greeting/indicator
# colors against blurred-background worst cases"); brings it in line with
# the Time/Date shadow convention now applied to every other label sitting
# directly on the blurred wallpaper.
label {
    monitor =
    text = Hi, $USER
    color = $secondary
    font_size = 18
    font_family = FiraCode Nerd Font
    position = 0, -40
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# ── Password input ───────────────────────────────────
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = $primary
    inner_color = $surface
    font_color = $on_surface
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="##$on_surface_variant_hex">  Enter Password...</span>
    hide_input = false
    rounding = 12
    check_color = $tertiary
    # check_text (FIX-02 gap closure, T-04-09 defense-in-depth): renders a visible
    # "checking" cue during any legitimate in-flight PAM verification (e.g. a wrong
    # password), so the keyboard is never a silent dead input during that ~2-3s window.
    check_text = <i>Checking...</i>
    fail_color = $error
    fail_text = <i>$FAIL</i>
    # fail_transition removed (FIX-02): option no longer exists in hyprlock 0.9.x —
    # the fail-color transition is handled by the inputFieldColors animation (default).
    capslock_color = $secondary
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -120
    halign = center
    valign = center
    shadow_passes = 2
}

# ── Battery + caps-lock row (D-11) ────────────────────
# Battery: reads the standard sysfs capacity file; gracefully empty (hidden)
# on desktop hardware with no BAT* device, same degrade-to-empty convention
# as now-playing above. Caps-lock: reads the LED brightness sysfs node as a
# small status word alongside the input-field's own capslock_color border cue.
# FIX (checkpoint re-diagnosis): added shadow_passes/shadow_size to both
# labels in this row — same legibility gap as now-playing/greeting above.
label {
    monitor =
    text = cmd[update:30000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | awk '{print $1"%"}'
    color = $on_surface
    font_size = 14
    font_family = FiraCode Nerd Font
    position = -60, -190
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

label {
    monitor =
    text = cmd[update:1000] cat /sys/class/leds/*capslock/brightness 2>/dev/null | grep -q '^1$' && echo "⇪ CAPS"
    color = $secondary
    font_size = 14
    font_family = FiraCode Nerd Font
    position = 60, -190
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# ── Failed-attempts counter ───────────────────────────
# $ATTEMPTS is hyprlock's own built-in failed-auth counter variable.
# FIX (checkpoint re-diagnosis): added shadow_passes/shadow_size — same
# legibility gap as the other new indicator labels above.
#
# FIX (checkpoint re-diagnosis): must render NOTHING at zero attempts and
# only appear after the first failure. Verified in hyprlock 0.9.5 source
# (IWidget.cpp's replaceAllAttempts()) that `$ATTEMPTS[fallback]` is a real,
# supported bracket-fallback form: at ATTEMPTS==0 the whole `$ATTEMPTS[...]`
# token is replaced with `fallback` (here left empty); at ATTEMPTS>0 it's
# replaced with the plain numeric count. Crucially, only the token itself is
# conditional — any literal text placed outside the brackets (e.g. the prior
# "Attempts: " prefix) still renders unconditionally at 0, which would have
# left a stray "Attempts: " visible before any failure. Dropped the prefix
# entirely so the label body IS the token: `$ATTEMPTS[]` -> invisible at 0,
# shows the bare failure count once attempts > 0.
label {
    monitor =
    text = $ATTEMPTS[]
    color = $error
    font_size = 14
    font_family = FiraCode Nerd Font
    position = 0, -220
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# ╔══════════════════════════════════════════════════════╗
# ║                    HYPRIDLE                           ║
# ╚══════════════════════════════════════════════════════╝

# ── Hyprland dispatch syntax after the 13.1 Lua cutover ──────────────
# A Lua-config-managed compositor withdrew the legacy IPC string form.
# `hyprctl dispatch dpms off` is textually wrapped into
# `return hl.dispatch(dpms off)` and evaluated as Lua SOURCE — a parse
# error ("')' expected near 'off'"). It exits 7, but hypridle discards
# the reply, so all three dpms calls in this file were SILENTLY DEAD
# from the cutover onward (the 15-minute display blank never fired).
# Same mechanism as the waybar workspace-click regression; same fix
# pattern already established by 13.1-09 in
# theme-engine/.config/theme-engine/theme-stress-test.
#
# MIND THE TABLE — `hl.dsp.dpms("on")` does NOT mean "turn on".
# The bare-string form is ignored ENTIRELY: every value falls through to
# the enum zero-default TOGGLE. Verified live against the
# `hyprctl monitors -j` .dpmsStatus oracle (the `ok` reply lies here —
# all forms reply `ok`): "on", "off", "enable", "disable" and "toggle"
# ALL merely flip. Only the TABLE form reaches the real parser
# (`tableToggleAction(..., field = "action")` in LuaBindingsInternal.hpp),
# and it is idempotent:
#     {action="on"}  -> ENABLE   (on from on, on from off)
#     {action="off"} -> DISABLE  (off from on, off from off)
# Idempotence is load-bearing, not cosmetic: misc:mouse_move_enables_dpms
# and misc:key_press_enables_dpms are both true, so the compositor has
# ALREADY woken the display by the time on-resume below runs. Under the
# toggle semantics the string form silently produces, on-resume would
# switch the display back OFF on every single wake — turning a dead
# feature into an actively hostile one. Do not "simplify" these back to
# a bare string.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}

# ── Waybar idle hide (BAR-01/D-05) ───────────────────
# Declares the "idle" intent to the visibility owner; the owner computes
# the resulting state (D-01's OR-union across idle/fullscreen/gaming) and
# actuates it. Never signals waybar directly. 120s is deliberately shorter
# than the 300s dim listener below it: D-01's OLED concern is "a static
# bar lit for hours while you read or code," so the bar's own idle
# threshold must be meaningfully shorter than the screen-dim listener or
# it never fires during exactly the scenario it exists for. on-resume
# fires on any keypress/mouse movement, so idle-hide clears on any input
# with no extra machinery (D-02) -- there is no edge-hover reveal
# anywhere in this design and none may be added.
listener {
    timeout = 120
    on-timeout = ~/.config/hypr/scripts/waybar-visibility.sh idle hide
    on-resume = ~/.config/hypr/scripts/waybar-visibility.sh idle show
}

# ── Dim screen after 5 minutes ───────────────────────
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}

# ── Lock screen after 10 minutes ─────────────────────
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# ── Turn off display after 15 minutes ────────────────
# Table form is mandatory here — see the dispatch-syntax note at the top
# of this file. on-resume in particular MUST be idempotent ENABLE, not
# toggle: wake-on-input has already turned the display on before this runs.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}

# ── Suspend after 30 minutes ─────────────────────────
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

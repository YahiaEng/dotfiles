# ╔══════════════════════════════════════════════════════╗
# ║                    HYPRIDLE                           ║
# ╚══════════════════════════════════════════════════════╝

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# ── Waybar idle hide (BAR-01/D-05) ───────────────────
# Declares the "idle" intent to the visibility owner; the owner computes
# the resulting state (D-01's OR-union across idle/fullscreen/gaming) and
# actuates it. Never signals waybar directly. 120s is deliberately shorter
# than the 300s dim listener below it: D-01's OLED concern is "a static
# bar lit for hours while you read or code," so the bar's own idle
# threshold must be meaningfully shorter than the screen-dim listener or
# it never fires during exactly the scenario it exists for. on-resume
# fires on any keypress/mouse movement, so idle-hide clears on any input
# with no extra machinery (D-02) -- there is no edge-hover reveal
# anywhere in this design and none may be added.
listener {
    timeout = 120
    on-timeout = ~/.config/hypr/scripts/waybar-visibility.sh idle hide
    on-resume = ~/.config/hypr/scripts/waybar-visibility.sh idle show
}

# ── Dim screen after 5 minutes ───────────────────────
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}

# ── Lock screen after 10 minutes ─────────────────────
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# ── Turn off display after 15 minutes ────────────────
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# ── Suspend after 30 minutes ─────────────────────────
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

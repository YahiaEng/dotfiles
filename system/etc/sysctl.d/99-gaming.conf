# Gaming / latency tuning (dotfiles 260829-vfi)
#
# Installed by install.sh section_hardware, not stowed — /etc is root-owned
# and this repo's convention for system files is `sudo install -Dm644` from
# the system/ tree (see nftables.conf, pacman.d/hooks).
#
# Both values below were READ FIRST and are being changed from a measured
# non-default. Anything already at its best value is deliberately absent —
# see the note on vm.max_map_count at the bottom.

# Split-lock mitigation, measured at 1 (kernel default) on this host.
# A "split lock" is an atomic operation straddling a cache line. The kernel's
# mitigation penalises the offending process hard — historically by forcibly
# sleeping it — to stop one thread stalling every core. Several game engines
# and DRM/anti-tamper wrappers trip it in normal operation, where the penalty
# shows up as multi-millisecond frame hitches. Turning the mitigation off
# trades a noisy-neighbour protection that matters on shared servers for
# smooth frametimes on a single-user desktop.
kernel.split_lock_mitigate = 0

# Proactive memory compaction, measured at 20 (kernel default) on this host.
# The kernel periodically defragments physical memory in the background so
# huge-page allocations succeed later. On a 31 GiB desktop that work buys
# little and its stalls land in the middle of frames. 0 does not disable
# compaction — it only stops doing it speculatively; compaction still runs on
# demand when an allocation actually needs it.
vm.compaction_proactiveness = 0

# DELIBERATELY NOT SET: vm.max_map_count.
# Every "Linux gaming sysctl" list carries it, and on this host it is ALREADY
# 1048576 — Arch raised the default years ago. Writing it here would be a
# no-op presented as a tuning win, and would rot into a wrong value the day
# the default moves again. Measured with `sysctl -n vm.max_map_count` before
# this file was written.

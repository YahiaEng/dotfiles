# VFIO module ordering (dotfiles 260829-vfi)
#
# READ THIS BEFORE ADDING A LINE. The standard VFIO guide tells you to write:
#     options vfio-pci ids=10de:2484,10de:228b
# DO NOT. That pins the RTX 3070 to vfio-pci at boot, and this host has NO
# SECOND GPU — the Ryzen 5 5600X has no integrated graphics and 07:00.0 is
# the only display adapter in the machine (verified: a single VGA device in
# `lspci`). Binding it at boot means the host comes up with no GPU, no
# framebuffer, no SDDM and no Hyprland: a black screen every boot, with
# recovery only over SSH or from another machine.
#
# Single-GPU passthrough binds LATE instead — the libvirt hook at
# /etc/libvirt/hooks/qemu tears down the graphical session and hands the card
# over at VM start, then gives it back at VM stop. This file therefore
# carries ORDERING ONLY.

# Ensure the vfio stack is loadable and its dependencies resolve in order
# when the hook modprobes vfio-pci.
softdep vfio-pci pre: vfio vfio_iommu_type1

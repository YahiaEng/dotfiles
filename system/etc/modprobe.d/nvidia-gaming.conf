# NVIDIA driver options for gaming (dotfiles 260829-vfi)
#
# WHAT IS NOT HERE, AND WHY
# The single most-copied line in NVIDIA tuning guides is
#     options nvidia NVreg_UsePageAttributeTable=1
# It is ABSENT because it is not a parameter of the driver installed here.
# Checked with `modinfo -p nvidia` against nvidia-open-dkms 610.57.04: the
# name does not appear. Writing it would have produced a modprobe error or a
# silently ignored line, and either way a tuning claim with nothing behind it.
# Re-check with modinfo before adding anything to this file.

# Skip zeroing system memory allocations before handing them to the GPU.
# Confirmed present via `modinfo -p nvidia`. Removes a memset from the
# allocation path, which shows up as fewer hitches on large streaming
# allocations and slightly more usable VRAM.
#
# TRADEOFF, STATED PLAINLY: this is why the driver zeroes by default. With
# it off, memory handed to the GPU may still contain a previous allocation's
# contents, so data can in principle leak between processes on this machine.
# That is an accepted tradeoff on a single-user desktop and NOT one to carry
# onto a shared or multi-tenant host. Revert by deleting this file and
# rebuilding the initramfs.
options nvidia NVreg_InitializeSystemMemoryAllocations=0

#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:
#
# security/etc/nftables.conf — this repo's own host firewall ruleset,
# installed to /etc/nftables.conf by install.sh (quick task 260827-np1).
#
# ── WHY THIS FILE EXISTS INSTEAD OF ARCH'S STOCK ONE ───────────────────
# The stock /etc/nftables.conf that ships with the nftables package
# declares:
#
#     chain forward {
#       type filter hook forward priority filter
#       policy drop
#     }
#
# That chain and Docker's own `ip filter FORWARD` chain both register at
# NF_INET_FORWARD with priority 0. Netfilter runs every registered hook
# and a DROP verdict from ANY of them is terminal — so a bare
# `policy drop` forward chain silently kills container traffic even
# though Docker's own rules would have accepted it.
#
# Measured on this host 2026-08-27: docker.service active with four
# networks — bridge, host, k3d-app, k3d-platform (two of them Kubernetes
# clusters). Enabling the stock ruleset here would have cut all four.
#
# So: NO forward chain. Docker/podman/libvirt manage forwarding through
# their own chains, which is exactly where that policy belongs. This file
# governs traffic terminating on the host, which is the part Docker does
# not manage and the part that was genuinely unprotected.
#
# ── AND WHY IT IS STRICTER THAN STOCK ─────────────────────────────────
# Stock carries `tcp dport ssh accept`. sshd is NOT running on this host
# (measured: no listener on :22), so that rule opens a port for a daemon
# that does not exist. It is omitted. If you ever enable sshd, uncomment
# the marked line below — that is a deliberate, visible decision rather
# than a default that quietly stood open for years.
#
# Everything listening on this host today is bound to loopback (Ollama
# :11434, CUPS :631, local DNS :53, a bun dev server :37700), so this
# ruleset closes an exposure that is currently theoretical — and keeps it
# closed as soon as anything starts listening on a real interface.

destroy table inet filter

table inet filter {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state { established, related } accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"

    # ICMP is required for path-MTU discovery and IPv6 neighbour
    # discovery; dropping it breaks more than it protects.
    meta l4proto { icmp, icmpv6 } accept comment "allow icmp"

    # DHCPv6 client — wlan0 holds an fe80:: address with a :546 listener.
    ip6 saddr fe80::/10 udp dport 546 accept comment "allow dhcpv6 client"

    # mDNS/SSDP are NOT opened. If a printer or cast target stops being
    # discoverable, that is this line's doing — open it deliberately:
    # udp dport { 5353, 1900 } accept comment "allow mdns/ssdp"

    # sshd is not installed/running on this host. Uncomment only when it is:
    # tcp dport ssh accept comment "allow sshd"

    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }

  # NOTE: there is deliberately NO `forward` chain here. See the header.
  # Adding one with `policy drop` will break Docker, k3d and libvirt.
}

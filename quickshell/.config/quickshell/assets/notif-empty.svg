<!--
  notif-empty.svg — the notification centre's empty-state illustration
  (Phase 19 Plan 06, D-19-22, 19-UI-SPEC.md § "Empty State").

  GATE-02 gap-closure fix (ISSUE 3, round 3): the prior two-motif version
  (a bell plus a separate checkmark badge) was rejected live as "looking
  terrible together" even after fixing their overlapping geometry (round
  2's own fix). Per the coordinator's explicit instruction this round —
  re-checked against 19-UI-SPEC.md/19-CONTEXT.md/FEATURES.md, none of
  which pin a literal Caelestia asset (D-19-22 leaves the specific asset
  under Claude's Discretion; FEATURES.md's own NOTIF section does not
  describe Caelestia's illustration's contents at the pixel level) —
  simplified to a SINGLE motif: one clean bell silhouette, nothing else
  competing for attention. A bell is the least ambiguous "notifications"
  symbol available and needs no second glyph to read correctly.

  Drawn as a single flat fill (#000000, no gradients, no internal
  shading) so it reads correctly as a silhouette once
  QtQuick.Effects.MultiEffect recolours every non-transparent pixel to
  BarRoles.accent at runtime (colorization: 1) — the exact mechanism
  Caelestia's own Colouriser wrapper uses. The literal fill colour below
  is never seen on screen; only its alpha shape is.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="#000000">
  <path d="M60 12c-4 0-7 3-7 7v4c-16 4-27 18-27 35v14c0 9-8 15-8 15h84s-8-6-8-15V58c0-17-11-31-27-35v-4c0-4-3-7-7-7z"/>
  <circle cx="60" cy="98" r="9"/>
</svg>

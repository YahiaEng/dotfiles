# swaync.service drop-in (D-01/D-05/13-02): points D-Bus-activated swaync
# at the sass-compiled state-dir stylesheet, same as Hyprland's
# exec-once-driven swaync-launch.sh.
#
# Root cause this fixes: swaync ships as a D-Bus-activatable systemd user
# service (org.freedesktop.Notifications). That race between systemd's own
# activation and Hyprland's exec-once launch has always existed, but was
# invisible before this plan — both racers used to resolve to the SAME
# file (swaync's own auto-discovery of ~/.config/swaync/style.css, which
# existed at that path before this plan converted it to style.scss). Now
# that colour+motion require an EXPLICIT `-s <compiled-path>` flag, the two
# racers can resolve to DIFFERENT files: swaync-launch.sh's explicit `-s`
# invocation vs. systemd's own unmodified unit, which starts a bare
# `/usr/bin/swaync` with no `-s` flag and falls back to the system stock
# /etc/xdg/swaync/style.css — unstyled. Empirically reproduced repeatably
# on this machine before this drop-in existed.
#
# Fix: make BOTH racers correct instead of eliminating one (rejected:
# masking swaync.service entirely — that makes Hyprland's exec-once the
# ONLY possible launch path, so if it ever fails there is no notification
# daemon and no recovery route; this drop-in keeps D-Bus activation as a
# working safety net that is ALSO themed).
#
# The empty `ExecStart=` line is required by systemd to reset the unit's
# original ExecStart value before the second line sets a new one — omitting
# it is a hard config error for a service type that only accepts one
# ExecStart. `%h` is systemd's own home-directory specifier, so this stays
# host-independent (no hardcoded username).
[Service]
ExecStart=
ExecStart=/usr/bin/swaync -s %h/.local/state/theme/swaync-style.css

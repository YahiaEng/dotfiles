### feral gamemode — applied for the lifetime of a game process
###
### Activated by launching through `gamerun` (which wraps `gamemoderun`), or
### by Steam launch options `gamemoderun %command%`. gamemoded is a user
### D-Bus service; nothing here needs root and nothing needs a group.

[general]
### The CPU governor is the single biggest win in this file. This host idles
### its cores at 79% of max under the default schedutil governor (measured:
### `lscpu` "CPU(s) scaling MHz: 79%"), and a game's frame-critical thread is
### exactly the workload that ramp-up latency hurts. `performance` pins the
### 5600X to full clocks for the game's lifetime and hands the governor back
### on exit — a temporary change, not a permanent one.
desiredgov=performance
defaultgov=schedutil

### Nice the game UP (negative renice) so the compositor and background
### tasks yield to it. 10 is gamemode's own recommended value; larger
### numbers start starving Hyprland itself, which shows up as input lag in
### the very session you are trying to make smooth.
renice=10

### Soft-realtime scheduling only when the core count can absorb it. `auto`
### enables it on >=4 cores; this is a 6c/12t part, so it engages.
softrealtime=auto

### Best-effort highest IO priority: shader compilation and asset streaming
### stop queueing behind background writes.
ioprio=0

inhibit_screensaver=1

[filter]
### Empty allow/deny: gamemode applies to whatever requests it. Steam titles
### request it through gamemoderun, so an explicit allowlist would have to be
### maintained per game for no benefit.

[gpu]
### DELIBERATELY OFF. gamemode's GPU clock/power controls drive
### `nvidia-settings -a GPUPowerMizerMode`, which is an X11 client and needs
### a working DISPLAY. This is a Wayland-native Hyprland session, so on a
### bare `uwsm` session that call either no-ops or errors into the journal
### depending on whether Xwayland happens to be up — a setting that silently
### does nothing on some launches and something on others is worse than one
### that is off. The RTX 3070 already boosts on load without it.
###
### To enable anyway, uncomment all three and accept that gamemode's own
### docs call this "at your own risk" — a bad offset can hang the GPU:
# apply_gpu_optimisations=accept-responsibility
# gpu_device=0
# nv_powermizer_mode=1

[custom]
### Left empty. Scripts here run as the gamemode user session on every
### game start and stop; anything worth doing for every game belongs in
### `gamerun` instead, where it is visible at the call site.

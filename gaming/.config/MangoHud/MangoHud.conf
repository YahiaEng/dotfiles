### MangoHud — performance overlay
###
### Stowed from dotfiles/gaming. Reached by any process launched through
### `gamerun` (which exports MANGOHUD=1), or by prefixing `mangohud`.
###
### Starts HIDDEN. A permanently-visible HUD is a fine debugging tool and a
### poor way to play a game, so the default here is off and the toggle is a
### keybind. Right-Shift+F12 was chosen because it collides with nothing in
### hypr/.config/hypr/config/keybinds.lua and nothing in Steam's own overlay.

no_display=1
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2

### ── What to show ───────────────────────────────────────────────────────
### Ordered so the numbers that diagnose stutter sit together at the top.
### fps alone cannot tell a steady 90 from a 90 made of alternating 200s and
### 40s — frametime and the 1% low can, which is why both are on.

fps
frametime
frame_timing=1
fps_metrics=avg,0.01,0.001

gpu_stats
gpu_temp
gpu_junction_temp
gpu_power
gpu_mem_clock
gpu_core_clock
vram

cpu_stats
cpu_temp
cpu_power
core_load

ram
swap

### Which API and which driver actually got used. Worth having visible:
### a Proton title silently falling back from DX12 to DX11, or from the
### NVIDIA driver to llvmpipe, looks like "the game is just slow".
engine_version
vulkan_driver
wine

### ── Presentation ───────────────────────────────────────────────────────
### Colours are static rather than themed. The theme engine drives Hyprland,
### kitty, GTK and Quickshell through matugen; MangoHud is a Vulkan overlay
### inside another process's swapchain and is not on that pipeline, so a
### themed value here would go stale the moment the wallpaper changed and
### nothing would re-render it.

position=top-left
font_size=20
background_alpha=0.4
round_corners=8
table_columns=3

text_color=E6E6E6
gpu_color=76B900
cpu_color=4A9EFF
vram_color=AD64C1
ram_color=C26E6E
engine_color=EB5B5B
frametime_color=00FF6E
background_color=12141A

### ── Logging ────────────────────────────────────────────────────────────
### Only writes when toggled on with Shift_L+F2. Output is a CSV per run,
### readable by MangoHud's own `mangoplot`.
output_folder=/home/aorus/.local/share/mangohud-logs
log_duration=60
autostart_log=0

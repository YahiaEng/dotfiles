# ╔══════════════════════════════════════════════════════╗
# ║              MATUGEN CONFIGURATION                   ║
# ║       Material You dynamic color generation          ║
# ╚══════════════════════════════════════════════════════╝
#
# Reload is owned solely by theme-engine/lib/reload.sh (PIPE-02, D-04) — no
# post_hook lines below. Wallpaper-setting is owned by the engine/picker, not
# matugen (D-19) — leaving [config.wallpaper] enabled crashes `matugen json`
# outright, so it must stay absent. Every output_path below targets the
# state-dir contract (D-05/D-06); theme-engine/lib/generate.sh redirects the
# actual write location per-invocation via matugen's -p/--prefix flag.

[config]

# ── Hyprland colour token fragment (Lua-table pipeline, Phase 13.1) ──
# 13.1-10: this is now the ONLY Hyprland-side colour template. The
# hyprlang-format templates.hyprland block (hyprland-colors.conf ->
# ~/.local/state/theme/hyprland.conf, the D-12 rollback target) was
# retired alongside the static .conf tree once the operator resolved
# Task 2's one-way decision as retire-now — see
# 13.1-EQUIVALENCE-REPORT.md's "Decision (Task 2)" section. This fragment
# is consumed once by theme_engine_render_hypr_tokens
# (theme-engine/lib/motion.sh), which merges it into the single
# ~/.local/state/theme/hyprland-tokens.lua table and deletes it from the
# tmp render tree before commit.sh promotes anything — it never reaches
# the live state dir and carries no contract.json entry of its own
# (D-02/D-05). No post_hook — lib/reload.sh is the sole reload-fan-out
# owner (D-04).
[templates.hyprland_lua]
input_path = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.local/state/theme/hyprland-colors.lua"

# ── Kitty colors ─────────────────────────────────────
[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.local/state/theme/kitty.conf"

# ── Yazi theme ───────────────────────────────────────
[templates.yazi]
input_path = "~/.config/matugen/templates/yazi-theme.toml"
output_path = "~/.local/state/theme/yazi.toml"

# ── VSCodium colors ─────────────────────────────────
[templates.vscodium]
input_path = "~/.config/matugen/templates/vscodium-colors.json"
output_path = "~/.local/state/theme/vscodium.json"

# ── GTK 3.0 colors ─────────────────────────────────
[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.local/state/theme/gtk-3.0-colors.css"

# ── GTK 4.0 colors ─────────────────────────────────
[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.local/state/theme/gtk-4.0-colors.css"

# ── Walker theme (hardcoded CSS, no @define-color) ──
[templates.walker]
input_path = "~/.config/matugen/templates/walker-style.css"
output_path = "~/.local/state/theme/walker-style.css"

# ── fzf color fragment (THM-04/D-15, wallpaper-picker.sh) ──
[templates.fzf]
input_path = "~/.config/matugen/templates/fzf-colors.conf"
output_path = "~/.local/state/theme/fzf-colors.conf"

# ── fish shell syntax colors (quick task 260818-nwo) ────
# kitty runs fish, so fish's highlighting is the terminal's most-read colour
# surface. Assigned from named roles here rather than left to resolve through
# the 16 ANSI slots — see the template header for the contrast measurements
# and why the ANSI mapping alone could not serve both jobs.
# Sourced by fish/.config/fish/config.fish; no post_hook needed, since fish
# reads it at shell start and existing shells are not re-themed live.
[templates.fish]
input_path = "~/.config/matugen/templates/fish-colors.fish"
output_path = "~/.local/state/theme/fish-colors.fish"

# ── zellij themed multiplexer config (D-01/D-02, quick task 260820-0ha) ──
# Unlike every fragment-shaped template above, this one renders a COMPLETE
# application config — keybinds, options AND the themes block — because
# KDL has no include/source mechanism and only an INLINE theme was measured
# to live-reload a running zellij session (see the template header for the
# byte-count evidence). No post_hook here either — lib/reload.sh is the
# sole fan-out owner (D-04), same as every other template in this file.
# zellij needs NO reload hook at all: it watches its own config file, and
# the symlink-plus-rsync mechanism commit.sh already uses was measured
# this session to live-reload a running session with no restart (D-05).
[templates.zellij]
input_path = "~/.config/matugen/templates/zellij-config.kdl"
output_path = "~/.local/state/theme/zellij.kdl"

# ── Hyprlock colors (LOCK-01/D-30, dedicated target) ────
[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock-colors.conf"
output_path = "~/.local/state/theme/hyprlock.conf"

# ── Zen browser chrome colors (THM-05/D-27) ──────────
[templates.zen]
input_path = "~/.config/matugen/templates/zen-userchrome.css"
output_path = "~/.local/state/theme/zen-userchrome.css"

# ── Satty annotation colors (SHOT-02/D-31) ───────────
[templates.satty]
input_path = "~/.config/matugen/templates/satty-colors.toml"
output_path = "~/.local/state/theme/satty.toml"

# ── fastfetch closed-box greeting (quick task 260818-srl) ────────────
# The rendered fastfetch.jsonc is validated as STRICT JSON by both
# theme-parity's "json" format extractor (contract.sh, jq-based) and this
# task's own `jq -e .` verification — so, unlike [templates.fish] and
# [templates.hyprland_lua] which are heavily commented (fish/Lua parsers
# accept comments; jq does not), the .jsonc TEMPLATE itself carries no `//`
# comments: any would render verbatim into a file jq must parse. All
# rationale lives here instead.
#
# display.color roles, measured against `surface` on this host's live
# materialyou palette (surface=#121318), WCAG relative-luminance formula —
# all four foreground-intent roles (never a bare `*_container`, the exact
# category error quick task 260818-nwo fixed in kitty-colors.conf):
#   keys      -> tertiary   #e1bbdc  10.90:1
#   title     -> primary    #b3c5ff  10.91:1
#   output    -> on_surface #e3e2e9  14.42:1  (plain, highest-contrast body
#                                              text for values — matches
#                                              fish-colors.fish's own
#                                              highest-contrast-for-values
#                                              precedent)
#   separator -> outline    #8f909a   5.85:1  (deliberately low-contrast/
#                                              receding — the same role
#                                              hyprland-colors.lua and
#                                              hyprlock-colors.conf already
#                                              use for borders/rings)
# All four clear WCAG AA (4.5:1).
#
# logo.color, all nine slots defined regardless of which art is active —
# this is what makes star.txt's 25 "$7" runs theme automatically without the
# template ever knowing which art was picked (the picker/selector seam — see
# box-close.awk's own header for the other half of that boundary). Defining
# all nine rather than only the slots today's arts use is deliberate: it is
# what lets an art be added, or re-offered, without touching this template.
# satan_cross.txt ("$2"/"$4"/"$5" runs) is the standing case in point — it
# was dropped from the picker in 260818-u6v for being 71 columns wide, but
# the file is still on disk and would theme correctly if ever re-offered:
#   1 primary               #b3c5ff  10.91:1  (the default single-colour
#                                              run every no-$N-marker art —
#                                              illuminati.txt,
#                                              cyberpunk_mask.txt — falls
#                                              back to; expected, not a
#                                              defect)
#   2 secondary              #c1c6dd  10.94:1
#   3 tertiary                #e1bbdc  10.90:1
#   4 on_primary_container    #dae1ff  14.31:1
#   5 error                   #ffb4ab  10.93:1
#   6 on_secondary_container  #dde2f9  14.42:1
#   7 on_surface               #e3e2e9  14.42:1
#   8 outline                  #8f909a   5.85:1
#   9 on_tertiary_container    #ffd6f9  14.34:1
# 4/6/9 reuse exactly the two "on_*_container" roles kitty-colors.conf
# already trusts directly against surface/background (color5/13, color6/14)
# at the same measured-safe contrast.
#
# The closed box (M-2/M-3/M-5): fastfetch has no value-width padding
# (`--key-width`/`--key-padding-left` pad KEYS only — verified live, a
# `{value:20}` format placeholder is silently ignored), so the right
# border cannot be drawn by fastfetch's config alone; box-close.awk (a
# post-filter, NOT part of this template) appends it. The template's only
# box job is the left rule: the horizontal run lives in
# `display.constants[0]` ONCE and every rule row references it via `{$1}`
# (verified live) — the box width lives in exactly one place. Width (54
# display columns: "┌" + 52 "─" + "┐") was set by measuring the widest
# rendered content row on this host inside a real kitty window (the
# `display` module's "2560x1440 in 27\", 165 Hz [External]" line, 49
# columns SGR-stripped) plus a 5-column margin — not the retired
# config.jsonc's hardcoded 38, which was already 9 columns too narrow for
# that same row. Rule rows set `outputColor` directly to `outline`
# (verified live that a `custom` module's own `outputColor` overrides
# `display.color.output` for just that module) so the drawn left border
# matches the colour box-close.awk re-emits by CAPTURING that same SGR
# sequence from the line's own first "│" — never a second constant, so the
# two can never drift apart.
#
# No post_hook — reload is owned solely by theme-engine/lib/reload.sh
# (PIPE-02, D-04). fastfetch is read once per interactive shell start
# (fish/.config/fish/config.fish's `fastfetch -c ...` greeting); an
# already-open shell keeps its old greeting until its next launch, the
# same "reads at shell start, existing shells are not re-themed live"
# shape [templates.fish] directly above already documents.
[templates.fastfetch]
input_path = "~/.config/matugen/templates/fastfetch.jsonc"
output_path = "~/.local/state/theme/fastfetch.jsonc"

# ── QML palette (D-11/TOKEN-01, Colours.qml singleton) ──
# JSON transport, never a generated QML document — Colours.qml's
# FileView/JsonAdapter updates its properties IN PLACE on every
# theme-apply, which is what lets the token inspector's swatches crossfade
# on a theme switch instead of hard-cutting. No new format handler needed
# on the theme-parity/contract.sh side: this reuses the existing generic
# `json` extractor (see vscodium.json/motion.json above).
[templates.qml]
input_path = "~/.config/matugen/templates/qml-palette.json"
output_path = "~/.local/state/theme/palette.json"

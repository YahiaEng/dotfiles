# Auto-generated by matugen — Material You
#
# ── tmux status bar, powerline (D-05, quick task 260819-vas) ────────────
# The 20th contract file. Format is `set -g <option> "<value>"`, one option
# per line, EVERY value double-quoted — never bare.
#
# Quoting is load-bearing, exactly as single quotes are in
# fish-colors.fish: tmux treats an unquoted `#` as a comment, and every
# powerline segment marker below starts with `#[`. Without the double
# quotes, `set -g status-left #[fg=...]...` would parse as `set -g
# status-left` followed by a comment — tmux would set the option to EMPTY
# and report no error, silently blanking the whole bar.
# Equally load-bearing in the OTHER direction: never place a literal `"`
# character inside a value. The pair extractor's value class
# (theme-engine/lib/contract.sh, `tmux-set` format) terminates at the
# first `"`, so a `"` mid-value would let the name extractor still match
# the full line while the pair extractor silently truncated the value —
# exactly the name/value asymmetry this file's format exists to avoid.
#
# ── Role assignment rule (follow without exception) ──────────────────
# A powerline segment is a background/foreground PAIR — every background
# role below is paired with its matching `on_*` role
# (primary/on_primary, surface_variant/on_surface_variant,
# surface/on_surface). A bare `*_container` role is a BACKGROUND and must
# never land in a foreground slot on its own — the same category error
# fish-colors.fish's and the fastfetch template's headers both document;
# the pairing rule makes it structurally impossible here. `outline` is
# used for inactive/receding elements (pane border, inactive window text)
# where LOW contrast is the intent. `error` — never a hardcoded red — is
# used for the activity style.
#
# ── Powerline separators (D-05) ───────────────────────────────────────
# U+E0B0 () closes a left-anchored segment (status-left reads left to
# right, prominence decreasing). U+E0B2 () opens a right-anchored one
# (status-right reads left to right too, but visually anchors to the
# screen's right edge, so its segments build UP toward the edge instead
# of down from it). Emitted as literal UTF-8 characters, not escape
# sequences — kitty runs FiraCode Nerd Font, which covers both
# codepoints (already measured, kitty.conf).
#
# Each arrow's `fg` is set to the OUTGOING segment's background and `bg`
# to the INCOMING segment's background — that is what makes the arrow
# read as a solid wedge instead of an outline.
#
# status-left: session-name segment on primary, arrow, host segment on
# surface_variant, arrow out to plain surface.
# status-right: the mirror — arrow in from plain surface, date segment on
# surface_variant, arrow, clock segment on primary.
#
# ── The one non-colour literal (M-4) ──────────────────────────────────
# `status-right` BEGINS with a guarded continuum save-interpolation:
# `#($HOME/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh
# 2>/dev/null)`. Mirrors how fzf-colors.conf's header calls out its own
# single literal (BG's "-1"). Why it is here: under tmux.conf's ordering
# (M-3) this rendered file's `source-file` is the LAST writer to
# `status-right`, which discards tmux-continuum's own injection of this
# same interpolation — and that injection is continuum's ONLY auto-save
# trigger, so dropping it silently disables auto-save. Re-adding it here
# keeps exactly ONE writer on `status-right` (matugen) while preserving
# the plugin's behaviour. It emits no visible output, and `2>/dev/null`
# keeps a pre-install host (the script absent because tpm/continuum
# haven't been fetched yet) from writing shell noise into the bar.
#
# Every colour value below is a matugen keyword. No hex is hardcoded
# anywhere in this template.

set -g status-style "bg={{colors.surface.default.hex}},fg={{colors.on_surface.default.hex}}"

set -g status-left-length 60
set -g status-right-length 60

set -g status-left "#[fg={{colors.on_primary.default.hex}},bg={{colors.primary.default.hex}}] #S #[fg={{colors.primary.default.hex}},bg={{colors.surface_variant.default.hex}}]#[fg={{colors.on_surface_variant.default.hex}},bg={{colors.surface_variant.default.hex}}] #h #[fg={{colors.surface_variant.default.hex}},bg={{colors.surface.default.hex}}] "

set -g status-right "#($HOME/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh 2>/dev/null)#[fg={{colors.surface.default.hex}},bg={{colors.surface_variant.default.hex}}]#[fg={{colors.on_surface_variant.default.hex}},bg={{colors.surface_variant.default.hex}}] %Y-%m-%d #[fg={{colors.surface_variant.default.hex}},bg={{colors.primary.default.hex}}]#[fg={{colors.on_primary.default.hex}},bg={{colors.primary.default.hex}}] %H:%M "

set -g window-status-style "fg={{colors.outline.default.hex}},bg={{colors.surface.default.hex}}"
set -g window-status-current-style "fg={{colors.on_primary_container.default.hex}},bg={{colors.primary_container.default.hex}}"
set -g window-status-activity-style "fg={{colors.on_error.default.hex}},bg={{colors.error.default.hex}}"

set -g pane-border-style "fg={{colors.outline.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"

set -g message-style "fg={{colors.on_primary_container.default.hex}},bg={{colors.primary_container.default.hex}}"
set -g message-command-style "fg={{colors.on_surface_variant.default.hex}},bg={{colors.surface_variant.default.hex}}"

set -g mode-style "fg={{colors.on_tertiary_container.default.hex}},bg={{colors.tertiary_container.default.hex}}"

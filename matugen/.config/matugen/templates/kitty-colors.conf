# Auto-generated by matugen — Material You
#
# ── ANSI slots must use FOREGROUND-intent roles (quick task 260818-nwo) ──
# color5/6/13/14 previously read `tertiary_container`/`secondary_container`.
# Container roles are surface/background colours by definition in Material
# You — `on_*_container` is the foreground partner meant to sit ON them — so
# using them as terminal text was a category error, not a tuning problem.
#
# Measured before the fix, WCAG contrast of color6 against `background`:
# 1.98:1 on the live matugen theme, and 1.10:1 - 1.56:1 across ALL TWENTY
# static palettes (worst: rosepine-dawn 1.10:1). AA needs 4.5:1. This is
# what made every fish command argument unreadable: fish's own
# `fish_color_param` default is `cyan` -> color6, so EVERY argument to
# EVERY command was drawn in a background colour. Nothing in fish/ overrides
# it, and kitty.conf runs `shell fish`, so this hit every kitty session.
#
# After the fix the same measurement gives 2.05:1 - 11.49:1 (cyan) and
# 4.52:1 - 21.00:1 (magenta) — `on_tertiary_container` clears AA in all 20
# palettes; `on_secondary_container` clears it in all 15 dark ones.
#
# KNOWN RESIDUAL, deliberately not fixed here: the five LIGHT palettes
# (catppuccin-latte, gruvbox-light, kanagawa-lotus, rosepine-dawn,
# tokyonight-day) still land under 4.5:1 on cyan — but so do the
# already-shipped accent slots in those same themes (color1 `error` fails in
# 8 palettes, color2 `tertiary` in 6, color3 `secondary` in 5, color4
# `primary` in 4). That is a palette-authoring problem in those five files,
# not a template mapping problem, and fixing it means editing palettes
# rather than this line. Recorded so the next reader does not mistake this
# mapping for a complete contrast guarantee.
